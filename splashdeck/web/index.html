<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>splashdeck</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">splashdeck</div>
      <div class="brand-subtitle" id="version">v0.0.0</div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-page="logo"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg><span>Splash screen</span></button>
      <button class="nav-item" data-page="display"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><span>Display</span></button>
      <button class="nav-item" data-page="device"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></svg><span>Device</span></button>
    </nav>
    <div class="footer">
      <div class="conn-row">
        <div class="conn bad" id="conn"><span id="connText">Offline</span></div>
      </div>
      <div class="device-count" id="connSub">No deck found</div>
    </div>
  </aside>

  <main class="main">
    <section class="page active" id="page-logo">
      <header class="page-header">
        <div>
          <h1>Splash screen</h1>
          <p class="sub" id="sourceName"></p>
        </div>
        <div class="actions">
          <button class="btn" id="openBtn"><svg class="i" viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>Open</button>
          <button class="btn" id="wallBtn"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Wallpaper</button>
          <button class="btn" id="pasteBtn"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>Paste</button>
          <button class="btn" id="exportBtn" disabled><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>Export</button>
          <button class="btn primary" id="sendBtn" disabled><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg><span id="sendLabel">Send to deck</span></button>
        </div>
      </header>

      <div class="logo-grid">
        <div class="col">
          <div class="card stage-card">
            <div class="stage" id="stage">
              <div class="bezel">
                <div class="screen" id="screen">
                  <canvas id="canvas" width="800" height="480"></canvas>
                  <canvas id="overlay" width="800" height="480"></canvas>
                  <div class="empty" id="empty">
                    <svg class="i big" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
                                      </div>
                  <div class="dropHint" id="dropHint">Drop to load</div>
                </div>
              </div>
              <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
            </div>
            <div class="stage-tools">
              <div class="tool-group">
                <button class="icon-btn" id="rotL" title="Rotate left"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
                <button class="icon-btn" id="rotR" title="Rotate right"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
                <button class="icon-btn" id="flipH" title="Flip horizontal"><svg class="i" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><path d="M12 20v2M12 14v2M12 8v2M12 2v2"/></svg></button>
                <button class="icon-btn" id="flipV" title="Flip vertical"><svg class="i" viewBox="0 0 24 24"><path d="M21 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3"/><path d="M4 12H2M10 12H8M16 12h-2M22 12h-2"/></svg></button>
              </div>
              <div class="tool-group zoom">
                <svg class="i muted" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M8 11h6"/></svg>
                <input type="range" id="zoom" min="1" max="4" step="0.01" value="1">
                <svg class="i muted" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>
                <span class="mono" id="zoomVal">100%</span>
              </div>
              <div class="tool-group">
                <button class="icon-btn" id="center" title="Reset position"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg></button>
                <button class="icon-btn toggle" id="keysBtn" title="Key overlay"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></button>
              </div>
            </div>
          </div>

          <div class="card library-card">
            <div class="card-head">
              <h2>Library</h2>
              
            </div>
            <div class="library" id="library"></div>
            
          </div>
        </div>

        <div class="col side">
          <div class="card">
            <div class="card-head"><h2>Framing</h2></div>
            <div class="field">
              <label>Scale</label>
              <div class="seg" id="mode">
                <button data-v="fill" class="on">Fill</button><button data-v="fit">Fit</button><button data-v="stretch">Stretch</button>
              </div>
            </div>
            <div class="field" id="bgField">
              <label>Background</label>
              <div class="swatches" id="bg">
                <button data-v="black" class="sw on" style="--c:#000" title="Black"></button>
                <button data-v="white" class="sw" style="--c:#fff" title="White"></button>
                <button data-v="blur" class="sw blur" title="Blur"></button>
                <label class="sw custom" title="Custom"><input type="color" id="bgColor" value="#808080"><span></span></label>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><h2>Adjust</h2><button class="link" id="adjReset">Reset</button></div>
            <div class="slider-row"><label>Brightness</label><input type="range" id="adjBright" min="50" max="150" value="100"><span class="mono" id="adjBrightV">100</span></div>
            <div class="slider-row"><label>Contrast</label><input type="range" id="adjContrast" min="50" max="150" value="100"><span class="mono" id="adjContrastV">100</span></div>
            <div class="slider-row"><label>Saturation</label><input type="range" id="adjSat" min="0" max="200" value="100"><span class="mono" id="adjSatV">100</span></div>
            <div class="toggle-row"><label>Grayscale</label><button class="switch" id="adjGray"></button></div>
          </div>
        </div>
      </div>
    </section>

    <section class="page" id="page-display">
      <header class="page-header">
        <div><h1>Display</h1></div>
      </header>
      <div class="cards-2">
        <div class="card">
          <div class="card-head"><h2>Brightness</h2><span class="mono big-val" id="briVal">70%</span></div>
          <input type="range" class="wide" id="bri" min="0" max="100" step="5" value="70">
          <div class="presets" id="briPresets">
            <button data-v="10">10</button><button data-v="25">25</button><button data-v="50">50</button><button data-v="75">75</button><button data-v="100">100</button>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Screen</h2></div>
          <div class="action-list">
            <button class="action" data-act="logo"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg><b>Show splash screen</b></button>
            <button class="action" data-act="wake"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><b>Wake</b></button>
            <button class="action" data-act="sleep"><svg class="i" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><b>Sleep</b></button>
          </div>
        </div>
      </div>
    </section>

    <section class="page" id="page-device">
      <header class="page-header">
        <div><h1>Device</h1><p class="sub" id="devSub">—</p></div>
        <div class="actions"><button class="btn" id="refreshBtn"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>Refresh</button></div>
      </header>
      <div class="cards-2">
        <div class="card">
          <div class="card-head"><h2>Info</h2></div>
          <div id="devInfo"></div>
        </div>
        <div class="card" id="permCard">
          <div class="card-head"><h2>Access</h2><span class="pill" id="permPill">—</span></div>
                    <pre class="code" id="udevRule">KERNEL=="hidraw*", ATTRS{idVendor}=="3142", ATTRS{idProduct}=="0060", MODE="0660", TAG+="uaccess"</pre>
          <button class="btn" id="copyRule"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy rule</button>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
