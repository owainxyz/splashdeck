name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open splashdeck
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: splashdeck version
      placeholder: "splashdeck --version"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Device firmware
      description: Shown on the Device page.
      placeholder: V3.D6.1.009
  - type: input
    id: distro
    attributes:
      label: Distribution and desktop
      placeholder: NixOS 26.05, Hyprland
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - nix run / nix profile
        - NixOS module
        - pip
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output from running `splashdeck` in a terminal, and `dmesg | grep -i 3142` if relevant.
      render: text
